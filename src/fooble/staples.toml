# Ingredients most kitchens keep, for pantry search. When a recipe needs one the cook did
# not list, it counts at its weight instead of as a whole missing ingredient.
# Names are canonical ingredient names, as in aliases.toml.
[weights]
# Assumed present.
"salt" = 0
"pepper" = 0
"water" = 0
"oil" = 0
"olive oil" = 0
# Probably present: two of these count as one missing ingredient.
"butter" = 0.5
"sugar" = 0.5
"flour" = 0.5
"vinegar" = 0.5
"honey" = 0.5
"mustard" = 0.5
"milk" = 0.5
"lemon" = 0.5
"stock" = 0.5
