[project]
name = "fooble"
version = "0.1.0"
description = "Unofficial Claude plugin to discover recipes on fooby.ch"
readme = "README.md"
license = "0BSD"
requires-python = "==3.11.16"
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
fooble = "fooble.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.12.15"

[tool.hatch.build.targets.wheel]
packages = ["src/fooble"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
